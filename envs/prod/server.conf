# Deploy target for this environment. The presence of this file marks the
# env as remote: `just deploy prod` requires it, local recipes refuse it.

# Docker SSH context that reaches the server.
DOCKER_CONTEXT=pachuca

# Must match SERVER_NAME in the hubbify server's servers/pachuca/server.env
# (stamped as a label on the proxy). The deploy aborts if the context points
# at a server with a different stamp.
SERVER_NAME=pachuca

# Ask for typed confirmation before manual deploys (CI skips the prompt).
PROTECTED=true

# The stack predates the envs/ layout — keep its original project name so
# the deployed containers and volumes are preserved.
COMPOSE_PROJECT=rigolidev
